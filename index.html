<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singapore PM2.5</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, Helvetica, sans-serif;
    background: transparent;
    color: #444;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
}

.card {
    background: #ffffff;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 2px;
}

.subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 20px;
}

/* Mobile-First Vertical Stack Layout */
.dashboard-layout {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Main Display Section (Top for mobile/skinny view) */
.main-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fafafa;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
}

.value {
    font-size: 65px;
    font-weight: bold;
    line-height: 1;
}

.unit {
    font-size: 14px;
    color: #777;
    margin-top: 4px;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    padding: 8px 22px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

/* Regions Section */
.regions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.region {
    padding: 12px 14px;
    border-radius: 10px;
    background: #f5f5f5;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Make Central (AIS) span full width to stand out and ensure visibility */
.region.central {
    grid-column: span 2;
    background: #dbe442;
    color: #000000;
    padding: 14px 16px;
}

.region-name {
    font-weight: 600;
    font-size: 14px;
}

.region-value {
    font-weight: bold;
    font-size: 16px;
}

.region.central .region-value {
    font-size: 18px;
}

/* Meta Information */
.meta-info {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.source a {
    color: #888;
    text-decoration: underline;
}

.loading {
    color: #777;
}

/* =========================
   PM2.5 COLOURS
   ========================= */
.green { color: #43a047; }
.green-bg { background: #43a047; }

.yellow { color: #fdd835; }
.yellow-bg { background: #fdd835; }

.orange { color: #ef6c00; }
.orange-bg { background: #ef6c00; }

.red { color: #c62828; }
.red-bg { background: #c62828; }
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="title">Singapore Air Quality</div>
        <div class="subtitle">PM2.5 Reading - Updated Every 15 Minutes</div>

        <div class="dashboard-layout">
            <!-- Main Display: Key Number & Status -->
            <div class="main-display">
                <div id="mainValue" class="value loading">--</div>
                <div class="unit">µg/m³</div>
                <div id="status" class="status green-bg">Loading...</div>
            </div>

            <!-- Regions Grid: Central (AIS) is emphasized and spans full width -->
            <div class="regions">
                <div class="region central">
                    <span class="region-name">Central (AIS)</span>
                    <span id="central" class="region-value">--</span>
                </div>
                <div class="region">
                    <span class="region-name">North</span>
                    <span id="north" class="region-value">--</span>
                </div>
                <div class="region">
                    <span class="region-name">South</span>
                    <span id="south" class="region-value">--</span>
                </div>
                <div class="region">
                    <span class="region-name">East</span>
                    <span id="east" class="region-value">--</span>
                </div>
                <div class="region">
                    <span class="region-name">West</span>
                    <span id="west" class="region-value">--</span>
                </div>
            </div>

            <!-- Metadata -->
            <div class="meta-info">
                <div id="updated">Loading latest data...</div>
                <div class="source">
                    Source: <a href="https://www.haze.gov.sg/" target="_blank" rel="noopener noreferrer">haze.gov.sg</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadPM25() {
    const API_URL = "https://api-open.data.gov.sg/v2/real-time/api/pm25";

    try {
        const response = await fetch(API_URL, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const result = await response.json();
        const item = result.data.items[0];
        const readings = item.readings.pm25_one_hourly;

        /* Display regional readings */
        document.getElementById("north").textContent = readings.north;
        document.getElementById("central").textContent = readings.central;
        document.getElementById("east").textContent = readings.east;
        document.getElementById("south").textContent = readings.south;
        document.getElementById("west").textContent = readings.west;

        /* Find highest PM2.5 reading */
        const values = [
            readings.north,
            readings.central,
            readings.east,
            readings.south,
            readings.west
        ].filter(value => typeof value === "number");

        const highest = Math.max(...values);

        /* Main PM2.5 value */
        const mainValue = document.getElementById("mainValue");
        mainValue.textContent = highest;
        mainValue.className = "value " + getColour(highest);

        /* Status */
        const status = document.getElementById("status");
        status.textContent = getStatus(highest);
        status.className = "status " + getBackground(highest);

        /* Updated time */
        const date = new Date(item.updatedTimestamp);
        document.getElementById("updated").textContent = "Updated: " + date.toLocaleString("en-SG", {
            timeZone: "Asia/Singapore",
            dateStyle: "medium",
            timeStyle: "short"
        });

    } catch (error) {
        console.error("Unable to load PM2.5:", error);
        document.getElementById("mainValue").textContent = "--";
        const status = document.getElementById("status");
        status.textContent = "Unable to load data";
        status.className = "status red-bg";
        document.getElementById("updated").textContent = "Please try again later.";
    }
}

function getStatus(value) {
    if (value <= 55) return "Normal";
    if (value <= 150) return "Elevated";
    if (value <= 250) return "High";
    return "Very High";
}

function getColour(value) {
    if (value <= 55) return "green";
    if (value <= 150) return "yellow";
    if (value <= 250) return "orange";
    return "red";
}

function getBackground(value) {
    if (value <= 55) return "green-bg";
    if (value <= 150) return "yellow-bg";
    if (value <= 250) return "orange-bg";
    return "red-bg";
}

loadPM25();
setInterval(loadPM25, 15 * 60 * 1000);
</script>

</body>
</html>
